# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Use AndroidX (declare explicitly rather than relying on the AGP default).
android.useAndroidX=true
# Per-library R classes only — smaller R, faster incremental builds.
android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# --- Build local en Windows (Unicauca) ---
# gradle/verification-metadata.xml solo lista aapt2 para Linux y macOS; en Windows
# la verificacion estricta falla con aapt2-*-windows.jar. Lenient registra la
# diferencia y continua. No cambia nada del comportamiento de la app.
org.gradle.dependency.verification=lenient
# Red lenta (datos moviles): mas tiempo antes de abortar una descarga.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
